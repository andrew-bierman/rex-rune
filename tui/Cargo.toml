[package]
name = "rex-tui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde_json = "1"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
