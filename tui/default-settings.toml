# Workspace hosts and sessions are configured in workspace.json.
theme = "terminal"
startup_focus = "sidebar"

[sidebar]
side = "left"
# width = 28 # Columns. Omit for automatic sizing.

[panes]
borders = true
headers = true
default_colors = "terminal" # Set "server" to use the Rex terminal defaults.
ansi_palette = "server" # Set "terminal" to use the terminal emulator palette for ANSI 0–15.

[experimental]
input_composer = false
mouse_actions = false

[selection]
mouse = false

[keys]
settings = "F1"
compose_input = "F11"
copy_selection = "F12"
scroll_up = "Alt+PageUp"
scroll_down = "Alt+PageDown"
focus_left = "Ctrl+Alt+Left"
focus_right = "Ctrl+Alt+Right"
focus_up = "Ctrl+Alt+Up"
focus_down = "Ctrl+Alt+Down"
move_tab_left = "Alt+Shift+Left"
move_tab_right = "Alt+Shift+Right"
next_attention = "Alt+a"
new_session = "F2"
previous_tab = "F3"
next_tab = "F4"
new_tab = "F5"
toggle_focus = "F6"
next_pane = "F7"
split_right = "F8"
split_down = "F9"
quit = "F10"
close_session = "Shift+F2"
close_tab = "Shift+F5"
rename_session = "Shift+F6"
rename_tab = "Shift+F7"
rename_pane = "Shift+F8"
resize_left = "Ctrl+Shift+Left"
resize_right = "Ctrl+Shift+Right"
resize_up = "Ctrl+Shift+Up"
resize_down = "Ctrl+Shift+Down"
